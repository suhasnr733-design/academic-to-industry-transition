# backend/ml_service/docker-compose.yml

version: '3.8'

services:
  ml-service:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data/models:/app/data/models
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - ml_network

networks:
  ml_network:
    driver: bridge
