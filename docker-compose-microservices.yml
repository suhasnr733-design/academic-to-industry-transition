# docker-compose-microservices.yml

version: '3.8'

services:
  # API Gateway
  gateway:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/gateway.conf:/etc/nginx/conf.d/default.conf
    networks:
      - mesh_network

  # Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/ai_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    networks:
      - mesh_network

  # ML Service
  ml-service:
    build:
      context: ./backend/ml_service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - MODEL_PATH=/app/data/models
    volumes:
      - ./data/models:/app/data/models
    networks:
      - mesh_network

  # Auth Service
  auth-service:
    build:
      context: ./backend
      dockerfile: Dockerfile.auth
    ports:
      - "5001:5001"
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/ai_db
      - REDIS_URL=redis://redis:6379/0
    networks:
      - mesh_network

  # Notification Service
  notification-service:
    build:
      context: ./backend
      dockerfile: Dockerfile.notification
    ports:
      - "5002:5002"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
    networks:
      - mesh_network

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ai_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mesh_network

  redis:
    image: redis:7-alpine
    networks:
      - mesh_network

volumes:
  postgres_data:

networks:
  mesh_network:
    driver: bridge