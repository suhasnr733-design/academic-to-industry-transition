<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="badgeGradFav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="flareGradFav" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="96" height="96" rx="26" fill="url(#badgeGradFav)" />
  <rect x="2" y="2" width="96" height="48" rx="26" fill="url(#flareGradFav)" />

  <!-- Graduation Cap -->
  <polygon points="32,22 56,33 32,44 8,33" fill="#FFFFFF" />
  <path d="M17 38 V45 C17 50.5 47 50.5 47 45 V38" fill="#E0E7FF" />
  <path d="M32 33 L14 41 V50" stroke="#E0E7FF" stroke-width="3.5" stroke-linecap="round" />
  <circle cx="14" cy="51" r="3" fill="#FFFFFF" />

  <!-- Infinity Career Transition Ribbon -->
  <path
    d="M30,57 C20,57 14,64 14,72 C14,81 22,86 31,84 C41,82 52,66 64,58 C73,51 83,55 83,65 C83,74 75,80 65,78 C58,76 53,71 50,66"
    stroke="#FFFFFF"
    stroke-width="7.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Upward Career Growth Arrow -->
  <polygon points="65,18 92,23 85,49 79,40 62,47" fill="#FFFFFF" />
