<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="infinityGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="40%" stop-color="#4F46E5" />
      <stop offset="75%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#4338CA" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Infinity Ribbon Path -->
  <path
    d="M 28,68 C 14,68 8,56 8,46 C 8,32 20,24 32,28 C 45,32 56,58 68,66 C 80,74 92,68 92,54 C 92,40 82,34 72,38"
    stroke="url(#infinityGrad)"
    stroke-width="10"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#logoShadow)"
  />

  <!-- Graduation Cap on top left loop -->
  <g filter="url(#logoShadow)">
    <polygon points="24,14 44,22 24,30 4,22" fill="url(#capGrad)" stroke="#93C5FD" stroke-width="1.5" stroke-linejoin="round" />
    <path d="M 12,25.5 V 31 C 12,35.5 36,35.5 36,31 V 25.5" fill="#1D4ED8" stroke="#60A5FA" stroke-width="1" />
    <path d="M 24,22 L 7,29 V 37" stroke="#60A5FA" stroke-width="1.8" stroke-linecap="round" />
    <circle cx="7" cy="38" r="2" fill="#93C5FD" />
  </g>

  <!-- Dynamic Career Arrow Head on top right -->
  <path
    d="M 64,18 L 94,22 L 88,52 L 80,41 L 64,48 Z"
    fill="url(#infinityGrad)"
    filter="url(#logoShadow)"
  />
</svg>
